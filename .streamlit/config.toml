[theme]
font = "sans-serif"
headingFont = "sans-serif"
baseFontSize = 15
headingFontSizes = ["32px", "26px", "21px", "18px", "16px", "14px"]
headingFontWeights = [600, 600, 500, 500, 500, 500]
metricValueFontSize = "2.5rem"
metricValueFontWeight = 600
baseRadius = "8px"
buttonRadius = "8px"
showWidgetBorder = true
showSidebarBorder = true
paddingTop = "1.5rem"
paddingBottom = "3rem"

[theme.light]
primaryColor = "#7047BD"
backgroundColor = "#F3F5F9"
secondaryBackgroundColor = "#F0F2F7"
textColor = "#243342"
borderColor = "#D9DFDD"
greenColor = "#38745E"
orangeColor = "#9A6A32"
blueColor = "#476B88"
linkColor = "#7047BD"

[theme.dark]
primaryColor = "#7953BD"
backgroundColor = "#131D28"
secondaryBackgroundColor = "#1E2B38"
textColor = "#E7EBEA"
borderColor = "#35434D"
greenColor = "#8DB9A1"
orangeColor = "#CBA775"
blueColor = "#94B4CA"
linkColor = "#A3CAC8"

[theme.light.sidebar]
backgroundColor = "#1B222C"
secondaryBackgroundColor = "#28313E"
textColor = "#E9EEED"
primaryColor = "#7953BD"
borderColor = "#405363"
linkColor = "#A3CAC8"
codeBackgroundColor = "#28313E"

[theme.dark.sidebar]
backgroundColor = "#1B222C"
secondaryBackgroundColor = "#28313E"
textColor = "#E7EBEA"
primaryColor = "#7953BD"
borderColor = "#354957"
linkColor = "#A3CAC8"
codeBackgroundColor = "#28313E"
